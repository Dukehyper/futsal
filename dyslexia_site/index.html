<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduDyslexia - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend&family=OpenDyslexic&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation and accessibility controls -->
    <a href="#content" class="skip-link">Skip to content</a>
    <nav role="navigation">
        <ul class="breadcrumb">
            <li>Home</li>
        </ul>
        <div class="controls">
            <button id="font-minus" aria-label="decrease font size">-</button>
            <button id="font-plus" aria-label="increase font size">+</button>
            <button id="toggle-dyslexia" aria-label="Toggle dyslexia-friendly mode">Dyslexia Mode</button>
            <button id="toggle-contrast" aria-label="Toggle high contrast">Contrast</button>
            <button id="toggle-sepia" aria-label="Toggle sepia mode">Sepia</button>
            <button id="toggle-gradient" aria-label="Toggle gradient text guide">Guide</button>
        </div>
    </nav>
<!-- /Navigation -->
    <!-- Main content -->
    <main id="content" role="main" class="content">
        <h1>Welcome to EduDyslexia</h1>
        <p>This platform is designed to support students with dyslexia. Adjust the settings in the navigation bar to suit your reading preferences.</p>
        <p><a href="modules.html">Go to Modules</a></p>
    </main>
<!-- /Main content -->
<script src="js/script.js"></script>
</body>
</html>
